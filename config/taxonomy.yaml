  - category: survey
    query: "lithography review survey semiconductor"
  - category: survey
    query: "EUV lithography review"

# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
github_queries:
  - query: "lithography+semiconductor+stars:>10"
    category: technology
  - query: "EUV+lithography+stars:>5"
    category: technology
  - query: "OPC+computational+lithography+stars:>5"
    category: technology
  - query: "photoresist+simulation+stars:>5"
    category: materials
  - query: "nanoimprint+lithography+stars:>3"
    category: technology

# ── Codeberg repository discovery (fetch_codeberg_repos.py) ──────────────────
# (no codeberg queries defined — lithography tooling is not well-represented
#  on Codeberg; add queries here if relevant repos emerge)

# ── Trend / burst keywords ───────────────────────────────────────────────────
trend_keywords:
  - "EUV"
  - "high-NA"
  - "DUV"
  - "immersion"
  - "multi-patterning"
  - "nanoimprint"
  - "photoresist"
  - "optical proximity correction"
  - "OPC"
  - "DTCO"
  - "ASML"
  - "Zeiss"
  - "Trumpf"
  - "SMEE"
  - "SMIC"
  - "TSMC"
  - "Intel"
  - "export control"
  - "self-sufficiency"
  - "anamorphic"
  - "line edge roughness"

# ── Subclassification keywords ───────────────────────────────────────────────
subcategory_keywords:
  - id: euv
    keywords: ["EUV", "extreme ultraviolet", "13.5nm", "plasma source"]
  - id: duv
    keywords: ["DUV", "193nm", "248nm", "argon fluoride", "krypton fluoride", "immersion"]
  - id: high-na
    keywords: ["high-NA", "high NA", "anamorphic", "EXE:5000", "EXE:5200", "0.55 NA"]
  - id: multi-patterning
    keywords: ["multi-patterning", "multiple patterning", "SADP", "SAQP", "self-aligned", "double patterning", "quad patterning"]
  - id: nanoimprint
    keywords: ["nanoimprint", "NIL", "imprint lithography", "FPA-1200"]
  - id: china
    keywords: ["China", "Chinese", "SMEE", "SMIC", "Aishengna", "Yuliangsheng", "Huawei"]
  - id: general
    keywords: ["lithography", "semiconductor", "wafer", "scanner", "reticle", "mask"]

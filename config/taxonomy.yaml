# ⚙️ Research Taxonomy & Discovery Config — Lithography Research
#
# Semiconductor lithography: EUV, DUV, High-NA, nanoimprint, equipment
# (ASML, Canon, Nikon, SMEE, Aishengna), manufacturing nodes, export
# controls, photoresists, optics, and market dynamics.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Semiconductor Lithography Research"
  short: "lithography"
  description: "Global and Chinese semiconductor lithography progress — EUV, DUV, High-NA EUV, nanoimprint, equipment makers, manufacturing nodes, export controls, and market dynamics."
  openalex_mailto: "tobias@tobias-weiss.org"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
taxonomy:
  categories:
    - id: equipment
      display: "Lithography Equipment"
    - id: technology
      display: "Lithography Technology"
    - id: manufacturing
      display: "Semiconductor Manufacturing"
    - id: geopolitics
      display: "Geopolitics & Export Controls"
    - id: materials
      display: "Materials & Optics"
    - id: market
      display: "Market & Economics"
    - id: survey
      display: "Surveys & Reviews"

  subcategories:
    - id: euv
      display: "EUV Lithography"
    - id: duv
      display: "DUV Lithography"
    - id: high-na
      display: "High-NA EUV"
    - id: multi-patterning
      display: "Multi-Patterning"
    - id: nanoimprint
      display: "Nanoimprint Lithography"
    - id: china
      display: "China-Specific"
    - id: general
      display: "General"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
arxiv_queries:
  - query: 'cat:physics.app-ph AND (abs:"lithography" OR abs:"EUV" OR abs:"extreme ultraviolet")'
    category: technology
    subcategory_hint: euv
  - query: 'cat:physics.optics AND (abs:"lithography" OR abs:"EUV optics" OR abs:"extreme ultraviolet")'
    category: technology
    subcategory_hint: euv
  - query: 'cat:eess.SP AND (abs:"semiconductor manufacturing" OR abs:"lithography" OR abs:"process node")'
    category: manufacturing
    subcategory_hint: general
  - query: 'cat:physics.app-ph AND abs:"nanoimprint"'
    category: technology
    subcategory_hint: nanoimprint
  - query: 'cat:physics.app-ph AND (abs:"photoresist" OR abs:"EUV resist" OR abs:"chemically amplified resist")'
    category: materials
    subcategory_hint: general
  - query: 'cat:cond-mat.mtrl-sci AND (abs:"photoresist" OR abs:"EUV resist" OR abs:"line edge roughness")'
    category: materials
    subcategory_hint: general
  - query: 'cat:physics.app-ph AND (abs:"multi-patterning" OR abs:"self-aligned" OR abs:"SADP" OR abs:"SAQP")'
    category: technology
    subcategory_hint: multi-patterning
  - query: 'cat:eess.SP AND (abs:"DTCO" OR abs:"design technology co-optimization" OR abs:"lithography")'
    category: manufacturing
    subcategory_hint: general
  - query: 'cat:physics.app-ph AND (abs:"high-NA EUV" OR abs:"anamorphic" OR abs:"High NA")'
    category: technology
    subcategory_hint: high-na
  - query: 'cat:cs.AR AND (abs:"lithography" OR abs:"optical proximity correction" OR abs:"OPC" OR abs:"computational lithography")'
    category: technology
    subcategory_hint: general

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
other_sources_queries:
  - source: dblp
    query: EUV lithography semiconductor
    category: technology
    subcategory_hint: euv
  - source: crossref
    query: extreme ultraviolet lithography
    category: technology
    subcategory_hint: euv
  - source: europepmc
    query: photoresist EUV lithography
    category: materials
    subcategory_hint: general
  - source: crossref
    query: nanoimprint lithography semiconductor
    category: technology
    subcategory_hint: nanoimprint
  - source: europepmc
    query: high-NA EUV lithography
    category: technology
    subcategory_hint: high-na
  - source: crossref
    query: semiconductor manufacturing multi-patterning
    category: manufacturing
    subcategory_hint: multi-patterning
  - source: openalex
    query: EUV lithography optics
    category: materials
    subcategory_hint: general
  - source: semantic_scholar
    query: computational lithography optical proximity correction
    category: technology
    subcategory_hint: general

# ── OpenAlex bulk fetch (fetch_openalex_bulk.py) ─────────────────────────────
openalex_queries:

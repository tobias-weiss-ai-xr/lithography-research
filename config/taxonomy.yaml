    query: "nanoimprint lithography"
  - category: technology
    query: "multi-patterning lithography SADP SAQP"
  - category: technology
    query: "computational lithography optical proximity correction"
  - category: equipment
    query: "ASML lithography system"
  - category: equipment
    query: "Nikon lithography scanner"
  - category: equipment
    query: "Canon nanoimprint lithography"
  - category: equipment
    query: "SMEE lithography China"
  - category: manufacturing
    query: "semiconductor manufacturing process node"
  - category: manufacturing
    query: "DTCO design technology co-optimization lithography"
  - category: materials
    query: "EUV photoresist chemically amplified resist"
  - category: materials
    query: "EUV optics mirror Zeiss"
